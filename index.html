<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Dulu Yuk! 🔒</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            color: #333333;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.2);
        }

        .heart-icon {
            font-size: 30px;
            background: #ffe6eb;
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 18px;
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 26px;
            font-weight: 700;
            color: #d63384;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: 13px;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Pin Dots */
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #ffb6c1;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .dot.active {
            background-color: #d63384;
            border-color: #d63384;
            box-shadow: 0 0 8px rgba(214, 51, 132, 0.5);
        }

        /* Keypad */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 280px;
            margin: 0 auto;
        }

        .key {
            background: #fff0f3;
            border: 1px solid #ffccd5;
            color: #d63384;
            font-size: 22px;
            font-weight: 600;
            padding: 18px 0;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            user-select: none;
        }

        .key:active {
            background: #ff4d6d;
            color: #ffffff;
            transform: scale(0.95);
        }

        /* Main Content Screen */
        .content-screen {
            display: none;
            animation: fadeIn 0.8s ease;
        }

        .message-box {
            background: #fff0f3;
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #ffb6c1;
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #4a4a4a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: #e63946;
            font-size: 12px;
            margin-top: -15px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Keypad Lock Screen -->
        <div id="lock-screen">
            <div class="heart-icon">🩷</div>
            <h2>Password<br>Dulu Yuk! 🔒</h2>
            <p class="subtitle">Masukin tanggal spesial kita buat buka ini.</p>
            
            <div id="error-msg" class="error-msg">Password salah sayang, coba lagi!</div>

            <!-- Dot indikator 8 digit -->
            <div class="dots-container">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <!-- Keypad Angka -->
            <div class="keypad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" onclick="clearInput()">C</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key" onclick="deleteKey()">⌫</button>
            </div>
        </div>

        <!-- Halaman Isi Pesan Rahasia -->
        <div id="content-screen" class="content-screen">
            <div class="heart-icon">💌</div>
            <h2>Halo Sayang! ❤️</h2>
            <div class="message-box">
                Hai sayang...<br><br>
                Makasih ya udah nemenin aku terus. Halaman ini sengaja aku bikin khusus buat kamu.<br><br>
                I love you so much! 🥰✨
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PIN = "06070810";
        let currentPin = "";

        function pressKey(num) {
            if (currentPin.length < 8) {
                currentPin += num;
                updateDots();
            }

            if (currentPin.length === 8) {
                setTimeout(checkPin, 200);
            }
        }

        function deleteKey() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updateDots();
            }
        }

        function clearInput() {
            currentPin = "";
            updateDots();
        }

        function updateDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (index < currentPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

        function checkPin() {
            const errorMsg = document.getElementById('error-msg');
            if (currentPin === CORRECT_PIN) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('content-screen').style.display = 'block';
            } else {
                errorMsg.style.display = 'block';
                currentPin = "";
                updateDots();
            }
        }
    </script>
</body>
</html>
